name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version check compares against the merge base with main, so main's history is needed.
          fetch-depth: 0
      - name: Sub-plugin sync and marketplace version check
        # Actions has no local "main" branch; without BASE_REF the version check would be skipped.
        env:
          BASE_REF: origin/main
        run: bash scripts/check-sync.sh

  radar-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        # jsonschema enables the schema validation test, which is skipped without it.
        run: python -m pip install pytest jsonschema
      - name: thoughtworks-radar-ref tests
        run: python -m pytest -q -rs karak-architecture/skills/thoughtworks-radar-ref/scripts
