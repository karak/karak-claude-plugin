name: checks

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The version check compares against the merge base with main, so main's history is needed.
          fetch-depth: 0
      - name: Require jq
        # check-sync.sh skips the version check without jq, so fail loudly instead.
        run: jq --version
      - name: Sub-plugin sync and marketplace version check
        # Actions has no local "main" branch; without BASE_REF the version check would be skipped.
        # On a push to main, HEAD is origin/main itself, so compare with the commit before the push.
        env:
          BASE_REF: ${{ github.event_name == 'push' && github.event.before || 'origin/main' }}
        run: bash scripts/check-sync.sh

  release-gate:
    # main is the release branch: every merge into it is a release (see CLAUDE.md).
    if: github.base_ref == 'main' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Head branch is develop, versions bumped
        # On a PR, compare with the main tip and require the head to be develop.
        # On a push to main (e.g. a direct push), compare with the commit before the push;
        # HEAD_BRANCH is empty there, so only the version checks run.
        env:
          BASE_REF: ${{ github.event_name == 'push' && github.event.before || 'origin/main' }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: bash scripts/check-release.sh

  release-gate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/tests/test-check-release.sh

  line-endings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No CR in committed text files
        # .gitattributes converts CRLF to LF, but a lone CR survives and breaks shell scripts (#25).
        # --cached checks what is committed; -I skips binary files.
        run: |
          if git grep --cached -I -n $'\r'; then
            echo "::error::CR characters found in the files above. Convert them to LF."
            exit 1
          fi

  radar-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install test dependencies
        # jsonschema enables the schema validation test, which is skipped without it.
        run: python -m pip install pytest jsonschema
      - name: thoughtworks-radar-ref tests
        run: python -m pytest -q -rs karak-architecture/skills/thoughtworks-radar-ref/scripts
